# yamllint configuration.
# Ported from the sibling repo (caddy-waf); tuned for this repository:
# - docker-compose.yml is intentionally 2-space indented with long image/env
#   lines, so line-length is relaxed to 140 like the sibling.
# - openspec/ is a working directory for SDD changes (gitignored); its YAML
#   is machine-generated and not part of the quality gates.
extends: default

ignore: |
  tools/bin/
  .venv/
  openspec/

rules:
  document-start: disable

  truthy:
    allowed-values:
      - "true"
      - "false"
      - "on"
      - "off"

  line-length:
    max: 140
    allow-non-breakable-words: true

  comments:
    min-spaces-from-content: 1

  brackets:
    max-spaces-inside: 1

  indentation:
    indent-sequences: true

  empty-lines:
    max: 2

  trailing-spaces: enable

  new-line-at-end-of-file: enable
