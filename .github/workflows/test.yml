name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install linters
        run: make tools

      - name: Vet
        run: make vet

      # CI-1: govulncheck pinned via tools/versions.mk (GOVULNCHECK_VERSION),
      # never @latest; installed by "make tools" above. Findings fail the job.
      - name: Vulnerability scan (govulncheck)
        run: make vuln

      - name: Tests (race detector)
        run: make test-race

      - name: Build
        run: make build

  compose-config-no-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Ensure no local .env is present
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env

      - name: Validate compose config
        run: make compose-config

      - name: Assert no .env side effects
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo ".env was unexpectedly created during compose validation" >&2
            exit 1
          fi
