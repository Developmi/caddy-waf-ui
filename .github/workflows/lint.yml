name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Install linters
        run: make tools

      - name: Lint YAML
        run: uv run yamllint .

      - name: Lint GitHub Actions
        run: tools/bin/actionlint

      - name: Lint Dockerfile
        run: tools/bin/hadolint --failure-threshold warning Dockerfile

      - name: Lint Actions Security
        run: uv run zizmor .

      # No setup-go: the runner ships a Go toolchain and go.mod pins
      # `toolchain go1.26.6`, so Go auto-downloads it (GOTOOLCHAIN=auto
      # is the default). golangci-lint uses that toolchain.
      - name: Lint Go
        run: tools/bin/golangci-lint run ./...
